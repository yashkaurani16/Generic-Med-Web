<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#medGrad)" />
  <!-- Capsule pill symbol rotated 45deg -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Pill body left half (colored) -->
    <path d="M -140 -60 L 0 -60 L 0 60 L -140 60 A 60 60 0 0 1 -140 -60 Z" fill="#047857" />
    <!-- Pill body right half (white) -->
    <path d="M 0 -60 L 140 -60 A 60 60 0 0 1 140 60 L 0 60 Z" fill="url(#pillGrad)" />
    <!-- Dividing line -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#065f46" stroke-width="6" />
    <!-- Shine highlight -->
    <ellipse cx="-70" cy="-25" rx="30" ry="12" fill="rgba(255, 255, 255, 0.3)" />
  </g>
</svg>
